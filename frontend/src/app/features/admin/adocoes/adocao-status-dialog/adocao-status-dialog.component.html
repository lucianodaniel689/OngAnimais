<h2 mat-dialog-title>Alterar status da adoção</h2>

<form [formGroup]="form" (ngSubmit)="confirmar()">
  <mat-dialog-content class="adocao-status-dialog__conteudo">
    <p class="adocao-status-dialog__resumo">
      <strong>{{ data.adocao.nomeAnimal }}</strong> — adotante: {{ data.adocao.nomeAdotante }}
      ({{ data.adocao.telefoneAdotante }})
    </p>

    <mat-form-field appearance="outline">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        @for (s of statusOpcoes; track s) {
          <mat-option [value]="s">{{ rotuloStatus[s] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Observações</mat-label>
      <textarea
        matInput
        formControlName="observacoes"
        rows="3"
        placeholder="Ex: motivo da recusa"
      ></textarea>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="dialogRef.close()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Salvar</button>
  </mat-dialog-actions>
</form>
